services:
  postgres:
    image: postgres:16
    container_name: kokan-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: kokan
      POSTGRES_PASSWORD: kokan
      POSTGRES_DB: kokan
    volumes:
      - kokan-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kokan -d kokan"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kokan-pg-data:
